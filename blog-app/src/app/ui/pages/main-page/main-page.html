<main>
        <div class="container">
            <app-app-about-me></app-app-about-me>
            
            @if (hasPosts()) {
                <section class="posts">
                    @for (post of latestPosts(); track post.id) {
                        <app-main-post [post]="post"></app-main-post>
                    }
                    <div class="button_posts">
                        <a routerLink="/blog-page">Посмотреть все статьи</a>
                    </div>
                </section>
            }

            <app-app-skills [skills]="skills"></app-app-skills>
            <app-app-work [title]="career.title" [description]="career.description" [works]="works"></app-app-work>
            <app-app-hobby [title]="hobbyIntro.title" [description]="hobbyIntro.description" [hobbies]="hobbies"></app-app-hobby>
            
        </div>
    </main>
