    <article class="card_item" [routerLink]="['/blog-page', post.id]">
        <img [src]="post.image" alt="Обложка" />

        <button class="hover_delete" type="button" (click)="$event.stopPropagation(); onDelete()">
            <mat-icon>delete</mat-icon>
        </button>

        <button class="hover_edit" type="button" (click)="$event.stopPropagation(); onEdit()">
            <mat-icon>edit</mat-icon>
        </button>
        
        <div class="card_text">
            <h4 class="blog-article-title">{{ post.title }}</h4>
            <p class="blog-article-description">{{ post.description }}</p>
            <p class="date_post">{{ post.date }}</p>
        </div> 
    </article>
